<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandma Drives</title>
<style>
  html, body { margin: 0; height: 100%; background: #14052e; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; width: min(100vw, calc(100vh * 240 / 192)); height: auto; }
</style>
</head>
<body>
<canvas id="screen" width="240" height="192"></canvas>
<script type="text/javascript" src="odin.js"></script>
<script type="text/javascript">
(function () {
  const canvas = document.getElementById("screen");
  const g = canvas.getContext("2d");
  g.imageSmoothingEnabled = false;

  // Sheet order matches `Sheet` in src/web/web.odin.
  const files = ["natural", "civilized", "people", "creatures", "font"];
  const sheets = files.map(() => null);
  files.forEach((name, i) => {
    const img = new Image();
    img.onload = () => { sheets[i] = img; };
    img.src = "assets/" + name + ".png";
  });

  const hex = (rgb) => "#" + (rgb >>> 0).toString(16).padStart(6, "0");
  const tinted = new Map();
  function tintedSheet(i, rgb) {
    const key = i + ":" + rgb;
    let c = tinted.get(key);
    if (!c) {
      const img = sheets[i];
      c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const t = c.getContext("2d");
      t.drawImage(img, 0, 0);
      t.globalCompositeOperation = "source-in";
      t.fillStyle = hex(rgb);
      t.fillRect(0, 0, c.width, c.height);
      tinted.set(key, c);
    }
    return c;
  }

  // --- Audio. Everything is synthesised; nothing here is a recording. ---
  let ac = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  const WAVES = ["square", "sawtooth", "triangle"];
  // Sound effects: jsfxr samples, in the order of `Sound` in src/game/game.odin.
  const SFX = ["putt", "honk", "brake", "obey", "wrong", "timeout", "loud_mute", "arrive"];
  const sfxBuffers = SFX.map(() => null);
  let sfxRequested = false;
  function loadSfx(a) {
    if (sfxRequested) return;
    sfxRequested = true;
    SFX.forEach((name, i) => {
      fetch("assets/sfx/" + name + ".wav")
        .then((r) => r.arrayBuffer())
        .then((b) => a.decodeAudioData(b))
        .then((buf) => { sfxBuffers[i] = buf; })
        .catch(() => {});
    });
  }
  function sfx(id, gain, maxMs) {
    const a = audio();
    if (!a) return;
    loadSfx(a);
    const buf = sfxBuffers[id];
    if (!buf) return;
    const src = a.createBufferSource();
    const g = a.createGain();
    src.buffer = buf;
    g.gain.value = gain;
    src.connect(g); g.connect(a.destination);
    src.start(0, 0, Math.min(buf.duration, maxMs / 1000));
  }
  function tone(freq, ms, wave, gain) {
    const a = audio();
    if (!a) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = WAVES[wave] || "square";
    o.frequency.value = freq;
    const t = a.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  }
  // A radio that cannot be switched off, playing a hymn a few cents wrong, forever.
  let radioStarted = false, radioLoud = false, radioStep = 0;
  const HYMN = [0, 0, 7, 7, 9, 9, 7, -1, 5, 5, 4, 4, 2, 2, 0, -1];
  function radio(loud) {
    if (loud) radioLoud = true;
    if (radioStarted) return;
    radioStarted = true;
    setInterval(() => {
      const semi = HYMN[radioStep++ % HYMN.length];
      if (semi < 0) return;
      const wobble = (Math.random() - 0.5) * 70;                       // cents
      const wrong = Math.random() < 0.12 ? (Math.random() < 0.5 ? 1 : -1) : 0; // a wrong note
      const f = 220 * Math.pow(2, (semi + wrong) / 12 + wobble / 1200);
      tone(f, 260, 2, radioLoud ? 0.22 : 0.05);
    }, 300);
  }

  const imports = {
    canvas: {
      audio_sfx: sfx,
      audio_radio: radio,
      fill_rect: (x, y, w, h, rgb) => { g.fillStyle = hex(rgb); g.fillRect(x, y, w, h); },
      blit: (sheet, sx, sy, w, h, dx, dy, rgb) => {
        if (!sheets[sheet]) return;
        g.drawImage(tintedSheet(sheet, rgb), sx, sy, w, h, dx, dy, w, h);
      },
    },
  };

  window.addEventListener("load", () => {
    odin.runWasm("game.wasm", null, imports);
  });
})();
</script>
</body>
</html>
